[package]
name = "pf-roi-calculator"
version = "2.0.0"
description = "Prop Firm ROI Calculator — offline desktop shell"
authors = ["PF ROI Calculator contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/MFLS2023/pf-roi-calculator"
readme = "../README.md"

[lib]
name = "pf_roi_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller binaries in release builds. See https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
