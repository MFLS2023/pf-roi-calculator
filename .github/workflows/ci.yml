name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify the build produced a service worker and manifest
        run: |
          test -f dist/sw.js || (echo "::error::dist/sw.js missing — PWA generation failed" && exit 1)
          test -f dist/manifest.webmanifest || (echo "::error::manifest.webmanifest missing" && exit 1)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Fails the build if the icon generator drifts from what is committed.
  icons:
    name: Icons are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate icons
        run: node scripts/generate-icons.mjs

      - name: Fail if the generator output differs from the committed files
        run: |
          if ! git diff --quiet -- public src-tauri/icons; then
            echo "::error::Committed icons differ from scripts/generate-icons.mjs output. Run 'npm run icons' and commit the result."
            git diff --stat -- public src-tauri/icons
            exit 1
          fi
