name: Release desktop apps

# Builds native installers for Windows, macOS and Linux and attaches them to a
# draft GitHub Release. Runs entirely in CI, so contributors never need a local
# Rust toolchain.
#
# Trigger: push a tag like `v2.0.1`, or run the workflow manually.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            label: Linux (deb · AppImage · rpm)
          - platform: windows-latest
            label: Windows (msi · exe)
          - platform: macos-latest
            label: macOS (dmg · app)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # The macOS leg builds a universal binary, which needs both arch
          # targets installed (the official Tauri action template does the same).
          # On other platforms the extra std libs are harmless.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build and attach to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PF ROI Calculator ${{ github.ref_name }}'
          releaseBody: |
            Offline desktop builds of the Prop Firm ROI Calculator.

            | Platform | Files |
            | --- | --- |
            | Windows | `.msi` installer, `.exe` setup |
            | macOS | `.dmg` (universal) |
            | Linux | `.deb`, `.rpm`, `.AppImage` |

            No installation of Node or Rust is required — download and run.

            Verify the numbers yourself: the model is documented in the README.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
