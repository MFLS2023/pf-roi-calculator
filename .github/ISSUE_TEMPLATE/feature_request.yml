name: Feature request
description: Suggest a capability, a model change, or a UX improvement.
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Please keep the project's scope in mind: it is a **single-purpose, offline,
        dependency-light calculator**. Features that require a backend, a network
        call, or a heavy UI framework are unlikely to be accepted.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. "I can't tell whether a bigger account or several small ones is better" beats "add a chart".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mathematical model
        - Inputs / form
        - Results / metrics
        - Scenario comparison
        - Share image export
        - i18n / translations
        - PWA / offline
        - Desktop (Tauri) build
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
